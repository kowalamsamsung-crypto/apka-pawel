name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build W-H Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Nie znaleziono programu sdkmanager"
            exit 1
          fi

          echo "Używam: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        shell: bash
        run: |
          echo "Zawartość głównego katalogu:"
          ls -la

          if [ ! -f "settings.gradle" ]; then
            echo "BŁĄD: Nie znaleziono settings.gradle"
            echo "Pliki projektu Android muszą znajdować się w głównym katalogu repozytorium."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "BŁĄD: Nie znaleziono app/build.gradle"
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name installation package
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk W-H-Inspection.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: W-H-Inspection-APK
          path: W-H-Inspection.apk
          if-no-files-found: error
          retention-days: 30
